services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Data Source=/data/intergalaxy.db"
      RickAndMorty__BaseUrl: "https://rickandmortyapi.com/api/"
    volumes:
      - intergalaxy-data:/data
volumes:
  intergalaxy-data:
